name: Deploy marketing gateway

# Деплой шлюза отдела маркетинга на сервер.
# Работает С GitHub (раннеры GitHub имеют выход по SSH на сервер),
# а не из сессии Claude (там SSH закрыт политикой окружения).
#
# ИЗОЛЯЦИЯ: трогает ТОЛЬКО свой каталог и свой compose-проект
# (marketing-gateway). Чужие контейнеры/сервисы сервера не затрагивает.
#
# Нужные секреты репозитория (Settings -> Secrets and variables -> Actions):
#   SERVER_HOST          - IP сервера (82.117.87.252)
#   SERVER_USER          - пользователь SSH (root или отдельный marketing)
#   SERVER_SSH_PASSWORD  - пароль SSH         (ИЛИ используй ключ ниже)
#   SERVER_SSH_KEY       - приватный SSH-ключ (альтернатива паролю)
#   SERVER_SSH_PORT      - порт SSH (необязательно, по умолчанию 22)
#   MAX_BOT_TOKEN        - токен бота MAX

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/modest-dirac-lci3eg
    paths:
      - "gateway/**"
      - ".github/workflows/deploy-gateway.yml"

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

env:
  APP_DIR: /opt/ai-marketing-gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy gateway files to server (scp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: "gateway/*"
          target: ${{ env.APP_DIR }}
          overwrite: true
          strip_components: 0

      - name: Build & start only our isolated compose project (ssh)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          envs: MAX_BOT_TOKEN
          script: |
            set -euo pipefail
            cd "${{ env.APP_DIR }}/gateway"
            # .env пишем из секрета, в git он не попадает.
            umask 077
            printf 'MAX_BOT_TOKEN=%s\n' "$MAX_BOT_TOKEN" > .env
            # Поднимаем ТОЛЬКО наш проект. Никаких глобальных docker-команд.
            docker compose up -d --build
            echo "--- статус нашего контейнера ---"
            docker compose ps
            # Пауза, чтобы бот успел выполнить стартовый GET /me и войти в poll-цикл.
            echo "--- ждём 12 сек, пока бот стартует ---"
            sleep 12
            echo "--- последние логи (120 строк) ---"
            docker compose logs --tail=120 --no-color || true
            # Диагностика: доступ сервера к Anthropic (нужно для Claude Code CLI).
            echo "--- доступ к Anthropic с сервера ---"
            for u in https://api.anthropic.com/v1/messages https://claude.ai https://statsig.anthropic.com; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$u" || echo FAIL)
              echo "$u -> $code"
            done
            echo "--- ресурсы сервера ---"
            free -h | head -2 || true
            df -h / | tail -1 || true
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
