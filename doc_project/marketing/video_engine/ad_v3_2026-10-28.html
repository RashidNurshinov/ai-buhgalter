const back=x=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};

   E({t0:3.9,x:290,y:1440,html:'<img src="img/birwm612_cut.png" style="width:410px;display:block">',cls:'prod',a:'float'}),

   E({t0:6.5,x:800,y:1310,cls:'chip',html:'<span class="emo">🌀</span> 1200 об/мин',a:'pop',style:'font-size:40px'}),

   E({t0:9.6,x:800,y:1550,cls:'chip',html:'<span class="emo">⚡</span> A+++',a:'pop',style:'font-size:44px'}),
   E({t0:10.7,x:780,y:1690,cls:'price',html:'<small>БИРЮСА</small>28 500 ₽',a:'stamp',rot:-4,style:'font-size:90px'}),
   E({t0:13.1,x:540,y:520,cls:'stamp',html:'САМОЛЁТ ОТМЕНЯЕТСЯ',a:'stamp',rot:-10,style:'font-size:76px'}),
 ]},
 {t:[42.0,58.2],bg:'linear-gradient(180deg,#d9e7d2,#c9dcc0)',E:[

   E({t0:.3,t1:2.6,x:360,y:380,cls:'bub bl',html:'Где мои вещи?!',a:'slideL'}),
   E({t0:.9,t1:2.6,x:720,y:560,cls:'bub br',html:'На стуле <span class="emo">🪑</span>',a:'slideR'}),
   E({t0:1.5,t1:2.6,x:330,y:740,cls:'bub bl',html:'А шкаф?!',a:'slideL'}),
   E({t0:1.5,t1:2.6,x:540,y:1150,cls:'emo',html:'🪑',a:'shakeE',style:'font-size:340px'}),

   E({t0:2.9,x:540,y:930,html:'<img src="img/fenix2k_cut.png" style="width:400px;display:block">',cls:'prod',a:'float'}),
   E({t0:4.8,t1:10.8,x:250,y:1430,cls:'chip',html:'<span class="emo">🚪</span> 3 двери',a:'pop'}),
   E({t0:5.5,t1:10.8,x:770,y:1430,cls:'chip',html:'<span class="emo">📏</span> 120×220 см',a:'pop'}),
   E({t0:8.8,t1:10.8,x:540,y:1570,cls:'chip',html:'<span class="emo">✨</span> рельефный фасад',a:'pop'}),
   E({t0:10.9,x:540,y:250,cls:'cap',html:'стул: наконец-то<br>свобода <span class="emo">😮‍💨</span>',a:'pop'}),
   E({t0:12.7,x:540,y:1560,cls:'price',html:'<small>ФЕНИКС-2</small>27 830 ₽',a:'stamp',rot:3}),
 ]},
 {t:[58.2,72.5],bg:'radial-gradient(circle at 50% 40%,#2a3442,#0b0f14 75%)',E:[
   E({t0:.2,t1:3.3,x:540,y:420,cls:'big',html:'POV:',a:'glitch',style:'font-size:220px'}),
   E({t0:.9,t1:3.3,x:540,y:680,cls:'cap',html:'утро. ты опаздываешь<br>и ищешь ключи',a:'pop'}),
   E({t0:1.4,t1:3.3,x:250,y:1000,cls:'emo',html:'🔑',a:'shakeE',style:'font-size:150px'}),
   E({t0:1.7,t1:3.3,x:830,y:1120,cls:'emo',html:'🔑',a:'shakeE',style:'font-size:120px'}),
   E({t0:2.0,t1:3.3,x:540,y:1300,cls:'emo',html:'😱',a:'shakeE',style:'font-size:260px'}),

   E({t0:4.4,x:720,y:640,cls:'emo',html:'✨',a:'pop',style:'font-size:120px'}),

   E({t0:5.6,t1:10.9,x:260,y:1430,cls:'chip',html:'<span class="emo">🪞</span> зеркало',a:'pop'}),

 {t:[72.5,81],bg:'radial-gradient(circle at 50% 40%,#2b2f6b,#0b0d24 70%)',E:[

   E({t0:.7,x:540,y:770,cls:'stick',html:'<span class="emo">📍</span> ул. Торговая, 3',a:'slideL',style:'font-size:70px'}),
   E({t0:2.6,x:540,y:990,cls:'price',html:'<span style="font-family:DejaVu Sans">☎</span> (35366) 2-18-16',a:'stamp',style:'font-size:92px;background:#e30613;color:#fff'}),
   E({t0:5.3,x:540,y:1240,cls:'cap',html:'людмила ждёт <span class="emo">🥺</span>',a:'pop',style:'font-size:90px'}),
   E({t0:5.4,x:540,y:1520,html:'<img src="img/lg6ns6_cut.png" style="width:230px;display:block">',cls:'prod',a:'float'}),
 ]},
];
const FINAL={bg:'#0b0d24'};
// ---- конец

const host=$('S'),IMP=[];
SCENES.forEach((s,k)=>{let h=`<div class="scene" id="sc${k}">`;
  s.E.forEach((e,i)=>{h+=`<div class="el ${e.cls||''}" id="e${k}_${i}" style="left:${e.x}px;top:${e.y}px;${e.w?`width:${e.w}px;`:''}${e.style||''}">${e.html}</div>`;
    if(['stamp','glitch'].includes(e.a))IMP.push([s.t[0]+e.t0+(e.a==='stamp'?.12:0),e.a==='stamp'?1.3:.8])});
  host.insertAdjacentHTML('beforeend',h+'</div>');IMP.push([s.t[0],1.1])});

function anim(el,e,lt,dur){const t0=e.t0,t1=e.t1??dur+1,p=lt-t0;
  if(lt<t0||lt>t1+.25){el.style.display='none';return}el.style.display='block';
  const out=P(lt,t1,t1+.25),r=e.rot||0;let tr='',o=1-out;
  const q=P(lt,t0,t0+.35),b=back(q);
  if(e.a==='pop')tr=`scale(${L(0,1,b)*(1-out*.5)}) rotate(${r+Math.sin(p*3)*1.2}deg)`;
  else if(e.a==='stamp'){const s=P(lt,t0,t0+.18);tr=`scale(${L(3.2,1,expo(s))}) rotate(${L(r-25,r,expo(s))}deg)`;o=C(s*4)*(1-out)}
  else if(e.a==='glitch'){tr=`scale(${L(1.6,1,expo(q))}) translate(${p<.5?(Math.random()-.5)*30:Math.sin(p*40)*(Math.sin(p*1.7)>.93?8:0)}px,0)`;
    const g=p<.6||Math.sin(p*2.3)>.95?14:3;el.style.textShadow=`${g}px 0 #ff0040,${-g}px 0 #00e5ff`}
  else if(e.a==='slideL')tr=`translateX(${L(-1200,0,b)}px) rotate(${r}deg)`;
  else if(e.a==='slideR')tr=`translateX(${L(1200,0,b)}px) rotate(${r}deg)`;
  else if(e.a==='slideU')tr=`translateY(${L(500,0,b)}px) rotate(${r}deg)`;
  else if(e.a==='float'){const f=P(lt,t0,t0+.6);tr=`scale(${L(.5,1,back(f))*(1+p*.012)}) translateY(${Math.sin(p*1.8)*12}px) rotate(${r+Math.sin(p*1.1)*1.5}deg)`;
    el.style.filter=f<1?`blur(${(1-f)*16}px)`:'none';o=C(f*3)*(1-out)}
  else if(e.a==='strike'){el.firstChild.style.width=(expo(P(lt,t0,t0+.3))*100)+'%';tr='rotate(-4deg)'}
  else if(e.a==='type'){const n=Math.floor(C(p*22,0,e.text.length));el.textContent=e.text.slice(0,n)+(n<e.text.length?'▌':'');tr=''}
  else if(e.a==='shakeE'){tr=`scale(${L(0,1,b)}) rotate(${r+Math.sin(p*25)*8}deg)`}
  el.style.opacity=o;el.style.transform=`translate(-50%,-50%) ${tr}`}

function render(t){
  const k=SCENES.findIndex(s=>t>=s.t[0]&&t<s.t[1]);
  SCENES.forEach((s,i)=>$('sc'+i).style.display=i===k?'block':'none');
  if(k<0){$('bg').style.background=FINAL.bg}else{const s=SCENES[k],lt=t-s.t[0];$('bg').style.background=s.bg;
    s.E.forEach((e,i)=>anim($(`e${k}_${i}`),e,lt,s.t[1]-s.t[0]))}
  // финал (последняя сцена-финал задаётся как обычная сцена в SCENES)
  let sx=0,sy=0,rot=0,fl=0,zp=1;
  for(const [a,amp] of IMP){const d=t-a;if(d>=0&&d<.4){const kk=Math.exp(-d*12)*amp;sx+=Math.sin(d*90)*26*kk;sy+=Math.cos(d*75)*20*kk;rot+=Math.sin(d*60)*1.1*kk;zp+=.06*kk}}
  for(const s of SCENES){const d=t-s.t[0];if(d>=0&&d<.12)fl=Math.max(fl,(1-d/.12)*.85)}
  $('stage').style.transform=`translate(${sx}px,${sy}px) rotate(${rot}deg) scale(${zp})`;$('flash').style.opacity=fl;
  $('footer').style.display=k>0&&k<SCENES.length-1?'flex':'none';
  $('grain').style.backgroundPosition=`${(t*977)%300}px ${(t*631)%300}px`;
}
window.render=render;
window.ready=Promise.all([document.fonts.load('100px Russo'),document.fonts.load('900 46px Mont'),document.fonts.load('40px "Noto Color Emoji"')]).then(()=>document.fonts.ready).then(()=>{render(0);return true});
