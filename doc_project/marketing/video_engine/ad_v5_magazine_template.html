<!doctype html>
<html><head><meta charset="utf-8">
<!-- Шаблон v5 «Журнал ГАМБИТ»: журнал на столе, обложка и страницы перелистываются в 3D.
     Страницы — блоки .page внутри #pages; у каждой data-t0 (секунда, когда страница открыта).
     Элементы с data-t (сек. от открытия страницы) и data-a (rise|fade|pop|slideL|slideR|line|stamp|zoom) анимируются.
     render(t) рисует кадр. Стиль — как v4 «Журнал»: Unbounded + Manrope, светлая бумага. -->
<style>
@font-face{font-family:Unb;src:url(fonts/Unbounded-800.ttf);font-weight:800}
@font-face{font-family:Unb;src:url(fonts/Unbounded-500.ttf);font-weight:500}
@font-face{font-family:Man;src:url(fonts/Manrope-800.ttf);font-weight:800}
@font-face{font-family:Man;src:url(fonts/Manrope-500.ttf);font-weight:500}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#cfc5b8}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 40%,#e9e1d6,#b9ad9d 80%)}
#hint{position:absolute;left:0;top:70px;width:1080px;text-align:center;font:800 34px Man;letter-spacing:10px;color:#5b5248}
#mag{position:absolute;left:70px;top:190px;width:940px;height:1320px;perspective:2600px;transform-origin:50% 60%}
#magShadow{position:absolute;left:80px;top:1460px;width:920px;height:110px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.35),rgba(0,0,0,0) 70%)}
.leaf{position:absolute;left:0;top:0;width:940px;height:1320px;transform-origin:0 50%;transform-style:preserve-3d;display:none}
.face{position:absolute;left:0;top:0;width:940px;height:1320px;backface-visibility:hidden;overflow:hidden;border-radius:4px 14px 14px 4px;background:#f7f3ec}
.back{transform:rotateY(180deg);background:linear-gradient(90deg,#e6dfd3,#f1ebe1 40%,#e9e2d6)}
.spine{position:absolute;left:0;top:0;width:46px;height:100%;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0))}
.shade{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:0}
.a{position:absolute}
.mask{overflow:hidden;white-space:nowrap}.mask>span{display:inline-block}
.hdr{left:50px;top:36px;font:800 34px Unb;color:#e30613;letter-spacing:2px}
.hdr2{right:50px;top:44px;font:800 24px Man;color:#6b645c;letter-spacing:4px}
.hrule{left:50px;top:96px;height:3px;width:840px;background:#141414;transform-origin:0 0}
.frule{left:50px;top:1240px;height:2px;width:840px;background:#c9bfb2}
.fl{left:50px;top:1256px;font:800 22px Man;color:#8a8178;letter-spacing:3px}
.fr{right:50px;top:1256px;font:800 22px Man;color:#141414;letter-spacing:3px}
.kick{left:50px;top:140px;font:800 30px Man;letter-spacing:8px}
.ttl{left:44px;top:186px;font:800 116px Unb;color:#141414;letter-spacing:-2px;line-height:1.1}
.sub{left:50px;top:330px;font:500 36px Man;color:#6b645c;white-space:nowrap}
.blob{border-radius:50%}
.spec{width:400px;height:96px;border-bottom:2px solid #d8cfc3}
.spec .v{position:absolute;left:0;top:6px;font:800 48px Unb;color:#141414;white-space:nowrap}
.spec .l{position:absolute;left:0;top:62px;font:500 26px Man;color:#6b645c;white-space:nowrap}
.price{background:#141414;color:#fff;border-radius:24px;padding:14px 34px 20px;text-align:center;box-shadow:0 16px 30px rgba(0,0,0,.25)}
.price .p1{font:800 22px Man;letter-spacing:8px;opacity:.7}.price .p2{font:800 64px Unb;white-space:nowrap;line-height:1.1}
.quote{font:500 34px Man;color:#141414;font-style:italic;line-height:1.35}
.stamp{border:8px solid #e30613;color:#e30613;border-radius:14px;padding:4px 18px;font:800 40px Unb;background:rgba(247,243,236,.85);white-space:nowrap}
.card{width:400px;height:420px;background:#fff;border-radius:22px;box-shadow:0 10px 24px rgba(0,0,0,.08)}
.card img{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);object-fit:contain}
.card .cn{position:absolute;left:0;width:100%;bottom:30px;text-align:center;font:800 28px Man;color:#141414}
#foot{position:absolute;left:70px;top:1620px;width:940px;display:flex;justify-content:space-between;font:800 34px Man;color:#141414;border-top:3px solid #141414;padding-top:20px}
#flash{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#fff;opacity:0}
</style></head>
<body>
<div id="bg"></div>
<div id="hint">ЖУРНАЛ «ГАМБИТ» · ЛИСТАЙТЕ</div>
<div id="magShadow"></div>
<div id="mag"><div id="pages">
<!-- PAGES -->
</div></div>
<div id="foot"><span>ГАМБИТ</span><span>ул. Торговая, 3</span><span>(35366) 2-18-16</span></div>
<div id="flash"></div>
<script>
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>C((t-a)/(b-a)),L=(a,b,x)=>a+(b-a)*x;
const back=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const expo=x=>x>=1?1:1-Math.pow(2,-10*x),io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const $=id=>document.getElementById(id);
const FD=1.1; // длительность перелистывания
const leaves=[...document.querySelectorAll('.leaf')];
const T0=leaves.map(l=>parseFloat(l.dataset.t0));
leaves.forEach((l,i)=>{l.style.zIndex=100-i;
  const f=l.querySelector('.front');f.insertAdjacentHTML('beforeend','<div class="spine"></div><div class="shade"></div>');
  l.insertAdjacentHTML('beforeend','<div class="face back"><div class="shade" style="opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(0,0,0,0))"></div></div>')});
function anim(el,lt){const t0=parseFloat(el.dataset.t),a=el.dataset.a,r=parseFloat(el.dataset.r||0),p=lt-t0;
  const q=P(lt,t0,t0+.6);let tr='',o=1;
  if(a==='rise'){el.firstElementChild.style.transform=`translateY(${L(110,0,expo(q))}%)`;return}
  if(a==='fade'){o=q;tr=`translateY(${L(20,0,expo(q))}px)`}
  else if(a==='pop'){const b=back(P(lt,t0,t0+.45));o=C(q*3);tr=`scale(${L(.3,1,b)}) rotate(${r}deg)`}
  else if(a==='slideL'){o=C(q*2);tr=`translateX(${L(-120,0,expo(q))}px) rotate(${r}deg)`}
  else if(a==='slideR'){o=C(q*2);tr=`translateX(${L(160,0,back(q))}px) rotate(${r}deg)`}
  else if(a==='line'){el.style.transform=`scaleX(${expo(q)})`;return}
  else if(a==='stamp'){const s=P(lt,t0,t0+.2);o=C(s*4);tr=`scale(${L(2.6,1,expo(s))}) rotate(${L(r-20,r,expo(s))}deg)`}
  else if(a==='zoom'){o=C(q*2);tr=`translateY(${L(80,0,back(q))+Math.sin(p*1.3)*5}px) scale(${L(.85,1,back(q))*(1+Math.max(0,p)*.004)})`}
  el.style.opacity=lt<t0?0:o;el.style.transform=tr}
function render(t){
  // журнал «влетает» на стол в начале
  const qi=P(t,0,.9),e=back(qi);
  $('mag').style.transform=`translateY(${L(-1500,0,expo(qi))+Math.sin(t*.8)*4}px) rotateX(5deg) rotateZ(${L(-14,-1.2,e)}deg) scale(${L(.8,1,e)})`;
  $('magShadow').style.opacity=qi;$('hint').style.opacity=P(t,.8,1.4);
  leaves.forEach((l,i)=>{const open=T0[i],next=T0[i+1]??1e9,fs=next-FD/2,fe=next+FD/2;
    const vis=t>=open-FD/2&&t<fe;l.style.display=vis?'block':'none';if(!vis)return;
    const q=io(P(t,fs,fe));l.style.transform=`rotateY(${-180*q}deg)`;
    const sh=l.querySelector('.front .shade');sh.style.background='linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.35))';sh.style.opacity=Math.sin(Math.PI*q)*.8;
    const bs=l.querySelector('.back .shade');bs.style.opacity=Math.sin(Math.PI*q);
    // тень от переворачиваемого листа на странице под ним
    const under=leaves[i+1];if(under&&t>=fs){const us=under.querySelector('.front .shade');us.style.background='linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0) 70%)';us.style.opacity=t<fe?(1-q)*.9:0}
    const lt=t-open+0.35; // элементы страницы начинают появляться чуть раньше, пока лист ещё переворачивается
    l.querySelectorAll('[data-t]').forEach(el=>anim(el,lt))});
  $('foot').style.opacity=P(t,1,1.6);
  let fl=0;for(const b of T0.slice(1)){const d=t-b;if(d>-.05&&d<.12)fl=Math.max(fl,.12)}$('flash').style.opacity=fl;
}
window.render=render;
window.ready=Promise.all([document.fonts.load('800 100px Unb'),document.fonts.load('500 40px Unb'),document.fonts.load('800 40px Man'),document.fonts.load('500 40px Man')]).then(()=>document.fonts.ready).then(()=>{render(0);return true});
render(0);
</script>
</body></html>
