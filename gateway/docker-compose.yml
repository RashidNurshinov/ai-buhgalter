# Изолированный compose-проект отдела маркетинга.
# name задаёт имя проекта -> docker видит его отдельно от остальных на сервере.
# ВАЖНО: нет секции ports -> контейнер НИЧЕГО не слушает наружу (long polling).
name: marketing-gateway

services:
  gateway:
    build: .
    image: marketing-gateway:latest
    container_name: marketing_gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MAX_API_BASE: ${MAX_API_BASE:-https://platform-api2.max.ru}
      MAX_CA_BUNDLE: ${MAX_CA_BUNDLE:-}
    networks:
      - marketing_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  marketing_net:
    name: marketing_gateway_net
